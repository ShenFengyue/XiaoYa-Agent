<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XiaoYa - 情绪自省空间</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes float-slow {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, -30px) scale(1.1); }
  }
  @keyframes float-reverse {
    0%, 100% { transform: translate(0, 0) scale(1.1); }
    50% { transform: translate(-30px, 40px) scale(0.9); }
  }
  .bg-glow-1 {
    position: absolute; width: 40rem; height: 40rem; border-radius: 50%;
    filter: blur(160px); opacity: 0.25; animation: float-slow 15s ease-in-out infinite alternate;
    top: -10rem; left: -10rem; background: radial-gradient(circle, #ff9a9e 0%, #fecfef 100%);
  }
  .bg-glow-2 {
    position: absolute; width: 45rem; height: 45rem; border-radius: 50%;
    filter: blur(180px); opacity: 0.2; animation: float-reverse 18s ease-in-out infinite alternate;
    bottom: -10rem; right: -10rem; background: radial-gradient(circle, #a1c4fd 0%, #c2e9fb 100%);
  }
  
  /* 平滑渐变显示 */
  .page-transition {
    transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .page-hidden {
    opacity: 0; pointer-events: none; transform: translateY(15px);
  }

  /* 优雅的打字机等待动画 */
  .typing-dot {
    animation: typing-bounce 1.4s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing-bounce {
    0%, 100% { transform: translateY(0); opacity: 0.4; }
    50% { transform: translateY(-6px); opacity: 1; }
  }

  /* 自定义滚动条使其更隐形 */
  #chatLog::-webkit-scrollbar { width: 4px; }
  #chatLog::-webkit-scrollbar-track { background: transparent; }
  #chatLog::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.05); border-radius: 10px; }
  #chatLog::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.1); }
</style>
</head>
<body class="bg-[#fcfbfc] text-neutral-800 antialiased relative h-screen overflow-hidden font-sans select-none">

<div class="bg-glow-1 pointer-events-none"></div>
<div class="bg-glow-2 pointer-events-none"></div>

<div id="welcomePage" class="fixed inset-0 flex flex-col items-center justify-center z-20 px-6 page-transition">
  <div class="text-center max-w-lg">
    <h1 class="text-4xl md:text-5xl font-light tracking-widest text-neutral-800 mb-3">
      你好，我是<span class="font-normal bg-clip-text text-transparent bg-gradient-to-r from-stone-800 to-neutral-500">小雅</span>
    </h1>
    <p class="text-sm tracking-wider text-neutral-400 font-light mb-12">在这个安静的空间里，倾听你的每一缕心绪</p>
    
    <button id="startBtn" type="button" class="group relative inline-flex items-center justify-center px-12 py-3.5 overflow-hidden rounded-full border border-neutral-300 bg-white/40 backdrop-blur-md text-sm font-light tracking-widest text-neutral-700 shadow-sm transition-all duration-300 hover:border-neutral-400 hover:text-neutral-900 active:scale-98">
      <span class="relative z-10 flex items-center gap-2">
        开启对话 
        <svg class="w-4 h-4 transform transition-transform duration-300 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
      </span>
    </button>
  </div>
</div>

<div id="chatPage" class="fixed inset-0 page-transition page-hidden flex flex-col z-10 max-w-4xl mx-auto px-4 md:px-6">
  <div class="py-4 border-b border-neutral-100/60 flex items-center justify-between backdrop-blur-sm bg-[#fcfbfc]/50">
    <div class="flex items-center gap-2.5">
      <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
      <span class="text-sm font-medium tracking-widest text-neutral-700">小雅空间</span>
    </div>
    <span class="text-xs text-neutral-400 font-light tracking-wide">对话将保存在本地</span>
  </div>

  <div id="chatLog" class="flex-1 overflow-y-auto py-8 space-y-8 pr-1"></div>

  <div class="pb-6 pt-2 bg-transparent">
    <p id="inputHint" class="mb-3 text-center text-xs tracking-wide text-amber-600/80 font-light">发送前请先阅读并同意使用须知</p>
    
    <div class="relative flex items-end gap-3 bg-white/70 backdrop-blur-md border border-neutral-200/60 rounded-3xl p-2.5 shadow-sm focus-within:border-neutral-300 focus-within:shadow-md transition-all duration-300">
      <textarea id="messageInput" class="flex-1 resize-none bg-transparent pl-4 pr-2 py-2 text-[15px] leading-relaxed placeholder:text-neutral-400 outline-none disabled:text-neutral-400 max-h-32"
        placeholder="在这里写下你的感受..." rows="1" maxlength="2000" disabled></textarea>
      
      <button id="sendBtn" type="button" class="rounded-2xl bg-neutral-800 p-3 text-white transition duration-300 hover:bg-neutral-700 active:scale-95 disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-400 disabled:transform-none" disabled>
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 19l9-2-9-15-9 15 9 2zm0 0v-8"></path>
        </svg>
      </button>
    </div>
  </div>
</div>

<div id="disclaimerModal" class="fixed inset-0 z-30 hidden items-center justify-center bg-neutral-900/20 backdrop-blur-sm p-4 page-transition opacity-0" role="dialog" aria-modal="true" aria-labelledby="disclaimerTitle">
  <div class="max-h-[85vh] w-full max-w-md overflow-y-auto rounded-3xl bg-white/95 backdrop-blur-md p-8 shadow-2xl border border-neutral-100 transform scale-95 transition-transform duration-300">
    <h2 id="disclaimerTitle" class="text-base font-medium tracking-wider text-neutral-800 border-b border-neutral-100 pb-3">使用须知</h2>
    
    <div class="mt-5 space-y-4 text-sm leading-relaxed text-neutral-500 font-light">
      <p><strong class="font-normal text-neutral-700">1. 服务性质</strong>：「小雅」是 AI 驱动的自我觉察与情绪梳理工具，<span class="text-neutral-700 font-normal">不能替代</span>专业的心理咨询或医疗诊断。</p>
      <p><strong class="font-normal text-neutral-700">2. 隐私安全</strong>：数据会提交至第三方 AI 处理。请勿输入身份证、住址等极端敏感的隐私信息。</p>
      <p><strong class="font-normal text-neutral-700">3. 危机干预</strong>：若你当前处于紧急危机状态，请立刻拨打 <span class="text-neutral-700 font-normal">110 / 120</span> 或心理援助热线 <span class="text-neutral-700 font-normal">400-161-9995</span>。小雅无法处理紧急危机。</p>
      <p><strong class="font-normal text-neutral-700">4. 主理人</strong>：我是申哲（子期），有任何建议或合作欢迎交流（微信：Shenzhetongxue）。</p>
    </div>
    
    <label class="mt-6 flex cursor-pointer items-start gap-3 text-xs tracking-wide text-neutral-500 select-none">
      <input id="disclaimerCheck" type="checkbox" class="mt-0.5 h-3.5 w-3.5 rounded border-neutral-300 accent-neutral-800">
      <span>我已阅读并理解上述内容，知晓本工具的能力与限制</span>
    </label>
    
    <div class="mt-6 flex gap-3">
      <button id="disclaimerCancel" type="button" class="flex-1 rounded-2xl border border-neutral-200 py-3 text-sm text-neutral-500 hover:bg-neutral-50 transition">返回</button>
      <button id="disclaimerConfirm" type="button" class="flex-1 rounded-2xl bg-neutral-800 py-3 text-sm font-medium text-white hover:bg-neutral-700 transition disabled:cursor-not-allowed disabled:bg-neutral-200" disabled>开启旅程</button>
    </div>
  </div>
</div>

<script>
const DISCLAIMER_VERSION = {{ disclaimer_version | tojson }};
const DISCLAIMER_STORAGE_KEY = 'xiaoya_disclaimer_' + DISCLAIMER_VERSION;

const welcomePage = document.getElementById('welcomePage');
const chatPage = document.getElementById('chatPage');
const startBtn = document.getElementById('startBtn');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const chatLog = document.getElementById('chatLog');
const inputHint = document.getElementById('inputHint');
const disclaimerModal = document.getElementById('disclaimerModal');
const disclaimerCheck = document.getElementById('disclaimerCheck');
const disclaimerConfirm = document.getElementById('disclaimerConfirm');
const disclaimerCancel = document.getElementById('disclaimerCancel');

let conversation = [];
let isStreaming = false;
let disclaimerAccepted = sessionStorage.getItem(DISCLAIMER_STORAGE_KEY) === '1';

// 动态调整文本框高度以适应长文本
messageInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = (this.scrollHeight - 12) + 'px';
});

function setInputEnabled(enabled) {
  messageInput.disabled = !enabled;
  sendBtn.disabled = !enabled || isStreaming;
  inputHint.classList.toggle('hidden', enabled);
  messageInput.placeholder = enabled ? "写下你此刻真实的感受..." : "请先同意使用须知";
}

function showDisclaimerModal() {
  disclaimerCheck.checked = false;
  disclaimerConfirm.disabled = true;
  disclaimerModal.classList.remove('hidden');
  setTimeout(() => {
    disclaimerModal.classList.add('flex', 'opacity-100');
    disclaimerModal.querySelector('div').classList.remove('scale-95');
  }, 10);
}

function hideDisclaimerModal() {
  disclaimerModal.classList.remove('opacity-100');
  disclaimerModal.querySelector('div').classList.add('scale-95');
  setTimeout(() => {
    disclaimerModal.classList.add('hidden');
    disclaimerModal.classList.remove('flex');
  }, 300);
}

function acceptDisclaimer() {
  disclaimerAccepted = true;
  sessionStorage.setItem(DISCLAIMER_STORAGE_KEY, '1');
  hideDisclaimerModal();
  setInputEnabled(true);
  messageInput.focus();
}

function ensureDisclaimerBeforeSend() {
  if (disclaimerAccepted) return true;
  showDisclaimerModal();
  return false;
}

// 页面平滑切换
function switchPage(from, to) {
  from.classList.add('page-hidden');
  setTimeout(() => {
    from.classList.add('hidden');
    to.classList.remove('hidden');
    setTimeout(() => {
      to.classList.remove('page-hidden');
    }, 50);
  }, 400);
}

startBtn.addEventListener('click', () => {
  switchPage(welcomePage, chatPage);
  if (disclaimerAccepted) {
    setInputEnabled(true);
    messageInput.focus();
  } else {
    setInputEnabled(false);
    setTimeout(showDisclaimerModal, 500);
  }
});

disclaimerCheck.addEventListener('change', () => {
  disclaimerConfirm.disabled = !disclaimerCheck.checked;
});

disclaimerConfirm.addEventListener('click', () => {
  if (!disclaimerCheck.checked) return;
  acceptDisclaimer();
});

disclaimerCancel.addEventListener('click', () => {
  hideDisclaimerModal();
  switchPage(chatPage, welcomePage);
});

function scrollToBottom() {
  if (chatLog) {
    chatLog.scrollTo({
      top: chatLog.scrollHeight,
      behavior: 'smooth'
    });
  }
}

function createMessage(role, content, isTyping = false) {
  const wrapper = document.createElement('div');
  // 呼吸感布局：用户靠右，AI靠左
  wrapper.className = 'flex w-full opacity-0 translate-y-3 transition-all duration-500 ' + 
    (role === 'user' ? 'justify-end' : 'justify-start');

  const msg = document.createElement('div');
  // 极其轻量精致的气泡样式
  msg.className = 'max-w-[85%] md:max-w-[75%] px-5 py-3.5 text-[15px] leading-relaxed break-words whitespace-pre-wrap tracking-wide ' +
    (role === 'user' 
      ? 'bg-neutral-800 text-neutral-100 rounded-3xl rounded-tr-sm shadow-sm' 
      : 'bg-white border border-neutral-100 text-neutral-800 rounded-3xl rounded-tl-sm shadow-sm');

  if (isTyping) {
    msg.className += ' flex items-center gap-1.5 py-4';
    msg.innerHTML = `
      <span class="typing-dot w-1.5 h-1.5 bg-neutral-400 rounded-full"></span>
      <span class="typing-dot w-1.5 h-1.5 bg-neutral-400 rounded-full"></span>
      <span class="typing-dot w-1.5 h-1.5 bg-neutral-400 rounded-full"></span>
    `;
  } else {
    msg.textContent = content;
  }

  wrapper.appendChild(msg);
  chatLog.appendChild(wrapper);
  
  // 触发渐入动画
  setTimeout(() => {
    wrapper.classList.remove('opacity-0', 'translate-y-3');
  }, 50);

  scrollToBottom();
  return { wrapper, msg };
}

async function readAssistantResponse(response, onChunk) {
  if (!response.body) {
    onChunk(await response.text());
    return;
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    onChunk(decoder.decode(value, { stream: true }));
  }
  const tail = decoder.decode();
  if (tail) onChunk(tail);
}

async function sendMessage() {
  if (isStreaming) return;
  if (!ensureDisclaimerBeforeSend()) return;

  const message = messageInput.value.trim();
  if (!message) return;

  conversation.push({ role: 'user', content: message });
  createMessage('user', message);
  messageInput.value = '';
  messageInput.style.height = 'auto'; // 重置高度

  isStreaming = true;
  sendBtn.disabled = true;
  const typingMsg = createMessage('assistant', '', true);

  try {
    const response = await fetch('/api/process', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: conversation,
        stream: true,
        disclaimer_acknowledged: true,
        disclaimer_version: DISCLAIMER_VERSION,
      }),
    });

    if (!response.ok) {
      let err = '系统出了一点小状况，请稍后再试。';
      try { const d = await response.json(); err = d.error || err; } catch { err = (await response.text()) || err; }
      if (response.status === 403) {
        disclaimerAccepted = false;
        sessionStorage.removeItem(DISCLAIMER_STORAGE_KEY);
        setInputEnabled(false);
        showDisclaimerModal();
      }
      typingMsg.msg.className = 'max-w-[85%] px-5 py-3.5 text-sm bg-red-50 text-red-600 rounded-2xl border border-red-100';
      typingMsg.msg.textContent = err;
      conversation.pop();
      return;
    }

    let fullText = '';
    let receivedChunk = false;

    await readAssistantResponse(response, (chunk) => {
      if (!chunk) return;
      if (!receivedChunk) {
        typingMsg.msg.textContent = '';
        typingMsg.msg.className = 'max-w-[85%] md:max-w-[75%] px-5 py-3.5 text-[15px] leading-relaxed break-words whitespace-pre-wrap tracking-wide bg-white border border-neutral-100 text-neutral-800 rounded-3xl rounded-tl-sm shadow-sm';
        receivedChunk = true;
      }
      fullText += chunk;
      typingMsg.msg.textContent = fullText;
      scrollToBottom();
    });
    const finalText = fullText.trim();
    if (!finalText) {
      typingMsg.msg.textContent = '小雅刚刚走神了，可以再对我说一次吗？';
      conversation.pop();
      return;
    }
    typingMsg.msg.textContent = finalText;
    conversation.push({ role: 'assistant', content: finalText });
  } catch (err) {
    typingMsg.msg.className = 'max-w-[85%] px-5 py-3.5 text-sm bg-red-50 text-red-600 rounded-2xl border border-red-100';
    typingMsg.msg.textContent = '网络似乎断开了：' + (err.message || '错误');
    conversation.pop();
  } finally {
    isStreaming = false;
    sendBtn.disabled = !disclaimerAccepted;
  }
}

sendBtn.addEventListener('click', sendMessage);
messageInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>
</body>
</html>
