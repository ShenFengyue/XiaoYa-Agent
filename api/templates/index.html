<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XiaoYa</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* 背景光晕动画 */
@keyframes float {
  0%,100% { transform: translate(0,0); }
  50% { transform: translate(20px,20px); }
}
.bg-glow {
  position:absolute;
  width:30rem; height:30rem;
  border-radius:50%; filter:blur(140px);
  opacity:0.3; animation:float 10s ease-in-out infinite alternate;
}
.bg-glow:nth-child(1){ top:-8rem; left:-6rem; background:#ff7c7c; }
.bg-glow:nth-child(2){ bottom:-8rem; right:-6rem; background:#7cf3ff; }

/* 主标题淡入 */
.fade-in { opacity:0; animation:fadeIn 2s forwards; }
@keyframes fadeIn { to { opacity:1; } }

/* 高级按钮光晕 */
.fancy-btn {
  position: relative; overflow:hidden;
}
.fancy-btn::before {
  content:''; position:absolute;
  top:-50%; left:-50%;
  width:200%; height:200%;
  background:linear-gradient(60deg,#ff7c7c,#f9d423,#7cf3ff);
  opacity:0.4; transform:rotate(45deg) translate(-100%,-100%);
  transition: transform 0.5s ease;
}
.fancy-btn:hover::before { transform:rotate(45deg) translate(0,0); }
</style>
</head>
<body class="bg-stone-50 text-slate-800 antialiased relative h-screen overflow-hidden">

<!-- 背景光晕 -->
<div class="bg-glow"></div>
<div class="bg-glow"></div>

<!-- 欢迎页 -->
<div id="welcomePage" class="fixed inset-0 flex flex-col items-center justify-center z-20">
  <h1 class="text-5xl md:text-7xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 via-yellow-400 to-green-500 fade-in text-center">
    小雅，帮你看见自己
  </h1>
  <button id="startBtn" class="fancy-btn mt-10 rounded-full px-12 py-4 text-lg font-bold text-black shadow-xl hover:scale-105 transition-transform">
    点击开始
  </button>
</div>

<!-- 聊天页面 -->
<div id="chatPage" class="fixed inset-0 hidden flex flex-col z-10">
  <!-- 消息区域 -->
  <div id="chatLog" class="flex-1 overflow-y-auto p-10 space-y-6 bg-white"></div>
  <!-- 输入区域 -->
  <div class="border-t border-slate-200/70 p-5 bg-slate-50 flex items-center gap-4">
    <textarea id="messageInput" class="flex-1 resize-none rounded-2xl px-4 py-3 text-lg placeholder:text-slate-400 outline-none"
      placeholder="请输入内容..."></textarea>
    <button id="sendBtn" class="rounded-full bg-slate-900 px-6 py-3 text-white font-medium hover:bg-slate-800 transition">发送</button>
  </div>
</div>

<script>
const welcomePage = document.getElementById('welcomePage');
const chatPage = document.getElementById('chatPage');
const startBtn = document.getElementById('startBtn');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const chatLog = document.getElementById('chatLog');

let conversation = [];
let isStreaming = false;

// 点击开始进入聊天
startBtn.addEventListener('click', ()=>{
  welcomePage.classList.add('hidden');
  chatPage.classList.remove('hidden');
  messageInput.focus();
});

// 滚动到底部
function scrollToBottom(){ chatLog.scrollTop = chatLog.scrollHeight; }

// 创建消息
function createMessage(role, content, isTyping=false){
  const wrapper=document.createElement('div');
  wrapper.className=`mb-6 ${role==='user'?'text-right':'text-left'}`;
  const msg=document.createElement('div');
  msg.className=`inline-block max-w-[80%] px-6 py-4 rounded-2xl ${role==='user'?'bg-slate-900 text-white':'bg-slate-100 text-slate-800'} break-words`;
  msg.innerHTML=isTyping?'<span class="animate-pulse">思考中...</span>':content;
  wrapper.appendChild(msg); chatLog.appendChild(wrapper);
  scrollToBottom(); return {wrapper,msg};
}

// 发送消息
async function sendMessage(){
  if(isStreaming) return;
  const message=messageInput.value.trim();
  if(!message) return;
  conversation.push({role:'user',content:message});
  createMessage('user',message);
  messageInput.value=''; scrollToBottom();
  isStreaming=true; sendBtn.disabled=true;
  const typingMsg=createMessage('assistant','',true);

  try{
    const response=await fetch('/api/process',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:conversation})
    });
    if(!response.ok){
      let err='请求失败';
      try{const d=await response.json(); err=d.error||err;}catch{err=await response.text();}
      typingMsg.msg.textContent=err; return;
    }
    if(!response.body){
      const text=await response.text(); typingMsg.msg.textContent=text;
      conversation.push({role:'assistant',content:text}); return;
    }
    const reader=response.body.getReader(); const decoder=new TextDecoder('utf-8');
    let firstChunk=true; let assistantText='';
    while(true){
      const {value,done}=await reader.read(); if(done) break;
      if(firstChunk){typingMsg.msg.textContent='';firstChunk=false;}
      assistantText+=decoder.decode(value,{stream:true});
      typingMsg.msg.textContent=assistantText; scrollToBottom();
    }
    assistantText+=decoder.decode(); typingMsg.msg.textContent=assistantText;
    conversation.push({role:'assistant',content:assistantText.trim()});
  }catch(err){typingMsg.msg.textContent=`请求失败: ${err.message}`;}
  finally{isStreaming=false; sendBtn.disabled=false;}
}

// 绑定事件
sendBtn.addEventListener('click',sendMessage);
messageInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(); }
});
</script>
